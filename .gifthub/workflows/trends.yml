name: Update trending topics

on:
  schedule:
    # Hourly, 20 runs a day: skips 07:00-10:59 UTC (about 2-5 AM Central) to stay inside
    # Apify's free $5/month. Shift the hour ranges if your timezone is different.
    - cron: "7 0-6,11-23 * * *"
  workflow_dispatch:          # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Fetch trends and summarize
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python scrape_trends.py

      - name: Commit trends.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trends.json
          git diff --staged --quiet || (git commit -m "Update trends" && git push)
