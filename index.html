<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trending in the US</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ecf0f2;
    --ink: #0f1b26;
    --muted: #56646f;
    --rule: #b8c3cc;
    --accent: #00695c;
    --warn-bg: #fff1d6;
    --warn-ink: #5c3b00;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --text: "Newsreader", Georgia, "Times New Roman", serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1519;
      --ink: #e6eef2;
      --muted: #93a3ae;
      --rule: #2a3a44;
      --accent: #4fd1b5;
      --warn-bg: #3a2c0c;
      --warn-ink: #ffe2a3;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--text);
    font-size: 1.125rem;
    line-height: 1.55;
  }
  main {
    max-width: 52rem;
    margin: 0 auto;
    padding: 2.5rem 1.25rem 4rem;
  }

  header { margin-bottom: 2rem; }
  h1 {
    margin: 0 0 .5rem;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2rem, 6vw, 3.25rem);
    line-height: 1.05;
    letter-spacing: -.02em;
  }
  .meta {
    margin: 0;
    color: var(--muted);
    font-size: 1rem;
  }

  .notice {
    margin: 0 0 1.5rem;
    padding: .75rem 1rem;
    background: var(--warn-bg);
    color: var(--warn-ink);
    border-radius: 4px;
    font-size: 1rem;
  }

  ol { list-style: none; margin: 0; padding: 0; border-bottom: 1px solid var(--rule); }
  li {
    position: relative;
    display: grid;
    grid-template-columns: 2.75rem 1fr;
    column-gap: .5rem;
    padding: 1.25rem 0 1.35rem;
    border-top: 1px solid var(--rule);
  }
  .rank {
    font-family: var(--display);
    font-weight: 500;
    font-size: 1.1rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    padding-top: .45rem;
  }
  h2 {
    margin: 0 0 .35rem;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(1.5rem, 4.5vw, 2.25rem);
    line-height: 1.1;
    letter-spacing: -.015em;
    overflow-wrap: anywhere;
  }
  .reason { margin: 0 0 .6rem; max-width: 40rem; }
  .reason.empty { color: var(--muted); font-style: italic; }
  /* The topic title is the link; its ::after stretches the click area over the whole row */
  h2 a {
    color: inherit;
    text-decoration: none;
  }
  h2 a::after {
    content: "";
    position: absolute;
    inset: 0;
  }
  li:hover h2 a {
    color: var(--accent);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 4px;
  }
  h2 a:focus-visible { outline: none; }
  h2 a:focus-visible::after { outline: 3px solid var(--accent); outline-offset: -3px; }

  .state { color: var(--muted); padding: 2rem 0; }
  footer { margin-top: 1.5rem; color: var(--muted); font-size: .9rem; }

  @media (max-width: 30rem) {
    li { grid-template-columns: 2rem 1fr; }
    body { font-size: 1.0625rem; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Trending in the US</h1>
    <p class="meta" id="meta">Loading the latest list…</p>
  </header>

  <div id="notice" class="notice" hidden></div>
  <ol id="list" aria-label="Trending topics"></ol>
  <p id="state" class="state" hidden></p>

  <footer>
    Reasons are written by an AI model from recent tweets and can be wrong or incomplete.
  </footer>
</main>

<script>
(function () {
  var STALE_HOURS = 3;
  var listEl = document.getElementById("list");
  var metaEl = document.getElementById("meta");
  var noticeEl = document.getElementById("notice");
  var stateEl = document.getElementById("state");

  function showState(msg) {
    stateEl.textContent = msg;
    stateEl.hidden = false;
  }

  function ago(date) {
    var mins = Math.round((Date.now() - date.getTime()) / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return mins + (mins === 1 ? " minute ago" : " minutes ago");
    var hrs = Math.round(mins / 60);
    if (hrs < 48) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
    return Math.round(hrs / 24) + " days ago";
  }

  function render(data) {
    var trends = (data && data.trends) || [];
    if (!trends.length) {
      metaEl.textContent = "No trends yet.";
      showState("trends.json has no topics. Run the Update trending topics workflow from the Actions tab.");
      return;
    }

    var updated = new Date(data.updated);
    var valid = !isNaN(updated.getTime());
    metaEl.textContent = (data.region || "United States") +
      (valid ? ", updated " + ago(updated) : "");

    if (valid && (Date.now() - updated.getTime()) > STALE_HOURS * 3600 * 1000) {
      noticeEl.textContent = "This list is more than " + STALE_HOURS +
        " hours old. The scheduled update may be failing; check the Actions tab on GitHub.";
      noticeEl.hidden = false;
    }

    trends.forEach(function (t) {
      var li = document.createElement("li");

      var rank = document.createElement("span");
      rank.className = "rank";
      rank.textContent = t.rank;
      rank.setAttribute("aria-hidden", "true");

      var body = document.createElement("div");

      var h2 = document.createElement("h2");
      var a = document.createElement("a");
      a.href = t.search_url || ("https://twstalker.com/search/" + encodeURIComponent(t.topic));
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = t.topic;
      a.title = "See tweets about " + t.topic + " on TwStalker";
      h2.appendChild(a);

      var p = document.createElement("p");
      p.className = "reason";
      if (t.reason) {
        p.textContent = t.reason;
      } else {
        p.className += " empty";
        p.textContent = "No summary for this topic yet.";
      }

      body.appendChild(h2);
      body.appendChild(p);
      li.appendChild(rank);
      li.appendChild(body);
      listEl.appendChild(li);
    });
  }

  fetch("trends.json", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(render)
    .catch(function (err) {
      metaEl.textContent = "Couldn't load the list.";
      showState("trends.json didn't load (" + err.message + "). If you opened this file straight from your computer, " +
        "serve it from a local server or GitHub Pages instead, because browsers block fetch on file:// pages.");
    });
})();
</script>
</body>
</html>
