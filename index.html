<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trending Topics Dashboard</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --subtext-color: #94a3b8;
      --reddit-color: #ff4500;
      --google-color: #4285f4;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.25rem;
      margin-bottom: 0.5rem;
    }

    .timestamp {
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    .columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
    }

    .card-header h2 {
      margin: 0;
      font-size: 1.4rem;
    }

    .badge-reddit {
      color: var(--reddit-color);
    }

    .badge-google {
      color: var(--google-color);
    }

    .trend-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .trend-item {
      margin-bottom: 0.75rem;
    }

    .trend-link {
      display: block;
      padding: 0.75rem 1rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      color: var(--text-color);
      text-decoration: none;
      transition: background 0.2s ease, transform 0.1s ease;
      word-break: break-word;
    }

    .trend-link:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .reddit-section .trend-link:hover {
      border-left: 4px solid var(--reddit-color);
    }

    .google-section .trend-link:hover {
      border-left: 4px solid var(--google-color);
    }

    .loading {
      text-align: center;
      color: var(--subtext-color);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🔥 Live Trending Topics</h1>
      <div id="timestamp" class="timestamp">Loading updates...</div>
    </header>

    <div id="content" class="columns">
      <div class="loading">Fetching current trending data...</div>
    </div>
  </div>

  <script>
    async function loadTrends() {
      try {
        const response = await fetch('trends.json');
        if (!response.ok) throw new Error('Failed to load trends data');
        
        const data = await response.json();
        
        document.getElementById('timestamp').textContent = `Last updated: ${data.updated_at || 'Recently'}`;

        const content = document.getElementById('content');
        content.innerHTML = `
          <!-- Reddit Column -->
          <div class="card reddit-section">
            <div class="card-header">
              <h2 class="badge-reddit">Reddit Trends</h2>
            </div>
            <ul class="trend-list">
              ${(data.reddit || []).map(item => `
                <li class="trend-item">
                  <a href="${item.search_url}" target="_blank" rel="noopener noreferrer" class="trend-link">
                    ${item.title}
                  </a>
                </li>
              `).join('')}
            </ul>
          </div>

          <!-- Google Trends Column -->
          <div class="card google-section">
            <div class="card-header">
              <h2 class="badge-google">Google Trends</h2>
            </div>
            <ul class="trend-list">
              ${(data.google_trends || []).map(item => `
                <li class="trend-item">
                  <a href="${item.search_url}" target="_blank" rel="noopener noreferrer" class="trend-link">
                    ${item.title}
                  </a>
                </li>
              `).join('')}
            </ul>
          </div>
        `;
      } catch (error) {
        document.getElementById('content').innerHTML = `
          <div class="loading" style="color: #ef4444;">
            Error loading trend data. Please ensure <code>trends.json</code> is present and valid.
          </div>
        `;
      }
    }

    loadTrends();
  </script>
</body>
</html>
