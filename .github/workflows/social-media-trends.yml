name: Update social media trends

# No schedule on purpose. This runs when the Google Apps Script in apps-script/trigger.gs sends a
# repository_dispatch event (or when you click "Run workflow" in the Actions tab).
on:
  repository_dispatch:
    types: [trigger-trending-pull, trigger-expiration-pull]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-social-media-trends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build social_media_trends.json
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python social_media_trends.py

      - name: Commit social_media_trends.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add social_media_trends.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update social media trends"
          # The three workflows can finish at the same moment; rebase and retry so they don't clash.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((RANDOM % 6 + 3))
          done
          echo "Could not push after 5 attempts." >&2
          exit 1
